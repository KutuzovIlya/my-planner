              <span style="font-size: 16px; color: #8E8E93;">по будням</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>

            <div style="display: flex; align-items: center; gap: 10px;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.5 21a2 2 0 0 0 3 0"/></svg>

            </div>
            <div style="display: flex; align-items: center; gap: 5px;">
              <span style="font-size: 16px; color: #8E8E93;">за 5 минут</span>

              <span style="font-size: 16px; color: #C7C7CC;">не выбрана</span>
