<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0.06"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="t"><rect width="62" height="62" rx="18" fill="url(#tile)"/><rect x="1" y="1" width="60" height="60" rx="17" fill="none" stroke="url(#edge)" stroke-width="2"/></g>
  </defs>
  <rect width="512" height="512" fill="#08080F"/>
  <g filter="url(#blur)">
    <circle cx="160" cy="170" r="90" fill="#0A84FF"/>
    <circle cx="360" cy="160" r="80" fill="#BF5AF2"/>
    <circle cx="180" cy="360" r="80" fill="#30D158"/>
    <circle cx="370" cy="370" r="70" fill="#FF9F0A"/>
  </g>
  <g transform="translate(111 111)">
    <use href="#t" x="0" y="0"/><use href="#t" x="76" y="0"/><use href="#t" x="152" y="0"/><use href="#t" x="228" y="0"/>
    <use href="#t" x="0" y="76"/><use href="#t" x="76" y="76"/><use href="#t" x="228" y="76"/>
    <use href="#t" x="0" y="152"/><use href="#t" x="76" y="152"/><use href="#t" x="152" y="152"/><use href="#t" x="228" y="152"/>
    <use href="#t" x="0" y="228"/><use href="#t" x="76" y="228"/><use href="#t" x="152" y="228"/><use href="#t" x="228" y="228"/>
    <g filter="url(#glow)"><rect x="152" y="76" width="62" height="62" rx="18" fill="#fff"/></g>
    <path d="M168 108l11 11 21-24" fill="none" stroke="#08080F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
