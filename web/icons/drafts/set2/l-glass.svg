      <circle cx="110" cy="120" r="190" fill="#FF5FA2"/>
      <circle cx="440" cy="440" r="210" fill="#FFB02E"/>
      <circle cx="450" cy="80" r="160" fill="#2ED3FF"/>
      <circle cx="90" cy="460" r="140" fill="#7B3DFF"/>
    </g>
  </defs>
  <g filter="url(#blur)"><use href="#blobs"/></g>
  <rect x="104" y="120" width="304" height="292" rx="64" fill="#fff" fill-opacity="0.01" filter="url(#sh)"/>
  <g clip-path="url(#card)">
    <g filter="url(#blur2)" opacity="0.9"><use href="#blobs"/></g>
    <rect x="104" y="120" width="304" height="292" fill="url(#sheen)"/>
